name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install fastapi uvicorn sqlalchemy pydantic "pyjwt[crypto]" httpx python-multipart cryptography pypdf pytest pip-audit
      - run: pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt || true
      - name: Validate Azure infrastructure (no deployment)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
